[build]
  publish = "apps/web"

[build.environment]
  NODE_VERSION = "20"

# API_BASE is set in the web app — update this if API is deployed elsewhere
# For local dev: API runs on :3001
# For production: update the redirect to your API server URL
[[redirects]]
  from = "/api/*"
  to = ":3001/api/*"
  status = 200
  force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
